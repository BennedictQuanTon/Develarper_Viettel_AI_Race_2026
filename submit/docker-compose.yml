# Portal upload — Tuong T4 (fp8_flash + prefill fairness, platform OFF)
# Image: nakituonghuynh/develarper-lfm25:tuong-opt-v1
# Upload THIS file to BTC Portal.
#
# T1 (p01 Triton)    scored 61.03 (TTFT 50/71, TBT 4, fail 5)
# T2 (CUDA graphs)   scored 56.86 (TTFT 62/93, TBT 4, fail 5) -> REJECTED
# T3 (scheduler)     never submitted (slot became T4)
# T4 targets TTFT via chunked-prefill fairness (max-num-partial-prefills).

services:
  model:
    image: nakituonghuynh/develarper-lfm25:tuong-opt-v1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      # === Giữ nguyên fp8_flash stack (Yoshio 61.66) ===
      - --quantization=fp8
      - --dtype=bfloat16
      - --kv-cache-dtype=fp8
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --mamba-cache-mode=align
      - --mamba-backend=flashinfer
      - --max-num-batched-tokens=512
      - --block-size=32
      - --gpu-memory-utilization=0.96
      - --max-model-len=8192
      - --max-num-seqs=256
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
