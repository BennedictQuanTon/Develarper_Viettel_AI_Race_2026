# Portal upload — Tuong T1 (fp8_flash + opt-platform p01)
# Image: nakituonghuynh/develarper-lfm25:tuong-opt-v1
# Upload THIS file to BTC Portal.

services:
  model:
    image: nakituonghuynh/develarper-lfm25:tuong-opt-v1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --quantization=fp8
      - --dtype=bfloat16
      - --kv-cache-dtype=fp8
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --mamba-cache-mode=align
      - --mamba-backend=flashinfer
      - --max-num-batched-tokens=512
      - --block-size=32
      - --gpu-memory-utilization=0.96
      - --max-model-len=8192
      - --max-num-seqs=256
    environment:
      - ENABLE_DEVELARPER_OPT=1
      - DEVELARPER_PAYLOADS=p01_fused_rmsnorm
      - DEVELARPER_STRICT=0
      - DEVELARPER_LOG_LEVEL=INFO
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
