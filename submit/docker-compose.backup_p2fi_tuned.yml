# OPTIMIZED BACKUP COMPOSE (Uses already-public Image :p2-fi on Docker Hub)
# Baseline: Yoshio #10 (61.66 ERS)
# Upgrades over Yoshio #10:
#   1. --max-num-batched-tokens=768 (reduces Turn 1 prefill chunks from 4 to 2)
#   2. --max-num-seqs=128 (scopes queue management for 70 active conversations)
# Target ERS: 62.50 - 63.80+ (Zero Hub push waiting required)

services:
  model:
    image: longquanton/develarper-lfm25:p2-fi
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=8192
      - --gpu-memory-utilization=0.96
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
      - --kv-cache-dtype=fp8
      - --enable-chunked-prefill
      - --max-num-batched-tokens=768
      - --max-num-seqs=128
      - --block-size=32
      - --mamba-backend=flashinfer
      - --mamba-cache-mode=align
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
