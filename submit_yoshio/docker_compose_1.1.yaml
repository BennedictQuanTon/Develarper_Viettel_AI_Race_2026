# Scored 57.94, regressed heavily, do not submit
services:
  model:
    image: asterios2707/develarper-agent:latest
    entrypoint:
      - python3 
      - -m  
      - vllm.entrypoints.openai.api_server 
    command:
      - --model=/model 
      - --served-model-name=LFM2.5-1.2B-Instruct 
      - --host=0.0.0.0 
      - --port=8000
      - --quantization=fp8 
      - --dtype=bfloat16 
      - --kv-cache-dtype=fp8 
      - --tensor-parallel-size=1 
      - --enable-prefix-caching 
      - --enable-chunked-prefill 
      - --mamba-cache-mode=align 
      - --mamba-backend=flashinfer 
      - --max-num-batched-tokens=768 
      - --block-size=32
      - --gpu-memory-utilization=0.97
      - --max-model-len=8192 
      - --max-num-seqs=128
      - --optimization-level=3
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]